<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Audio Downloader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/icons/audio-downloader.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="mask-icon" href="assets/icons/safari-pinned-tab.svg" color="#2563eb">
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <meta name="msapplication-config" content="assets/icons/browserconfig.xml">
  <meta name="theme-color" content="#0f1715">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
  <script>
    document.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-paste-url]');
      if (!button || button.disabled) return;

      const input = document.querySelector('input[aria-label="Media URL"]');
      if (!input) return;

      try {
        const text = await navigator.clipboard.readText();
        const value = text.trim();
        if (!value) return;
        input.value = value;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.focus();
      } catch {
        input.focus();
      }
    });
  </script>
</body>
</html>
