<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Audio Downloader">
  <!-- Sleek Modern Gradient Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Modern Outline Icon centered flawlessly -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Slanted Note Head for an authentic, dynamic musical feel -->
    <ellipse cx="21.4" cy="39" rx="5.5" ry="4" transform="rotate(-15 20 38)" fill="#ffffff" stroke="none" />
    
    <!-- Music Note Stem and Beam -->
    <path d="M 25 38 V 18 H 43 V 38" fill="none" />
    
    <!-- The right stem seamlessly terminates into a downward arrowhead -->
    <path d="M 36 31 L 43 38 L 50 31" fill="none" />
    
    <!-- Minimalist, floating download tray -->
    <path d="M 36 46 H 50" fill="none" />
  </g>
</svg>
